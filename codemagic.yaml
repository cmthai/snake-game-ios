workflows:
  ios-capacitor:
    name: Build iOS Capacitor App - SnakeGame3D
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Extract iOS project from zip
        script: |
          echo "📦 Extracting iOS project..."
          if [ -f "ios.zip" ]; then
            mkdir -p ios
            python3 - << 'PYEOF'
          import zipfile, os
          with zipfile.ZipFile('ios.zip', 'r') as z:
              for info in z.infolist():
                  clean_name = info.filename.replace('\\', '/').lstrip('/')
                  if not clean_name:
                      continue
                  target_path = os.path.join('ios', clean_name)
                  if clean_name.endswith('/'):
                      os.makedirs(target_path, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target_path), exist_ok=True)
                      with z.open(info) as src, open(target_path, 'wb') as dst:
                          dst.write(src.read())
          print("Extracted and normalized iOS project files successfully.")
          PYEOF
            if [ -d "App" ] && [ ! -d "ios/App" ]; then
              mv App ios/
            fi
            if [ -d "ios/ios/App" ]; then
              mv ios/ios/* ios/
              rm -rf ios/ios
            fi
          fi
          echo "✓ iOS project tree ready at ios/App"

          chmod -R u+rwX,go+rX ios/ 2>/dev/null || true
          find ios -type d -exec chmod 755 {} + 2>/dev/null || true
          find ios -type f -exec chmod 644 {} + 2>/dev/null || true

          mkdir -p ios/App/CapApp-SPM/Sources/CapApp-SPM
          echo 'import Foundation' > ios/App/CapApp-SPM/Sources/CapApp-SPM/CapApp-SPM.swift
          echo 'public let isCapacitorApp = true' >> ios/App/CapApp-SPM/Sources/CapApp-SPM/CapApp-SPM.swift
          chmod -R 755 ios/App/CapApp-SPM
          chmod 644 ios/App/CapApp-SPM/Sources/CapApp-SPM/CapApp-SPM.swift
          chmod 644 ios/App/CapApp-SPM/Package.swift 2>/dev/null || true

          mkdir -p ios/App/App.xcodeproj/project.xcworkspace
          echo '<?xml version="1.0" encoding="UTF-8"?><Workspace version="1.0"><FileRef location="self:"></FileRef></Workspace>' > ios/App/App.xcodeproj/project.xcworkspace/contents.xcworkspacedata

          mkdir -p ios/App/App.xcworkspace
          echo '<?xml version="1.0" encoding="UTF-8"?><Workspace version="1.0"><FileRef location="group:App.xcodeproj"></FileRef></Workspace>' > ios/App/App.xcworkspace/contents.xcworkspacedata

      - name: Create Web Assets Mock Target (Prevent Stale Build Steps)
        script: |
          echo "🛠️ Creating Web Assets Mock Targets (dist, www, public)..."
          mkdir -p www dist ios/App/App/public

          if [ -f "index.html" ]; then
            cp index.html www/
            cp index.html ios/App/App/public/
          else
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>SnakeGame3D</title></head><body><h1>SnakeGame3D Web View</h1></body></html>' > www/index.html
            cp www/index.html ios/App/App/public/index.html
          fi

          if [ -d "css" ]; then cp -r css www/ && cp -r css ios/App/App/public/; fi
          if [ -d "js" ]; then cp -r js www/ && cp -r js ios/App/App/public/; fi
          if [ -d "avatars" ]; then cp -r avatars www/ && cp -r avatars ios/App/App/public/; fi

      - name: Ensure Package & Capacitor Config (Automatic Code Signing)
        script: |
          echo "⚙️ Verifying package.json and capacitor.config.json..."
          echo '{"name":"snakegame3d","version":"1.0.0","dependencies":{"@capacitor/core":"^8.6.0","@capacitor/cli":"^8.6.0","@capacitor/ios":"^8.6.0"}}' > package.json

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.ncp.snakegame",
            "appName": "SnakeGame3D",
            "webDir": "www",
            "server": {
              "iosScheme": "ionic",
              "allowNavigation": [
                "pmix01.thddns.net",
                "*.google.com",
                "*.googleapis.com",
                "*.googleusercontent.com",
                "*.line.me",
                "*.line-scdn.net",
                "*.line-apps.com"
              ]
            },
            "ios": {
              "contentInset": "always",
              "allowsLinkPreview": false,
              "scrollEnabled": false
            }
          }
          EOF

          cp capacitor.config.json ios/App/App/capacitor.config.json

      - name: Resolve Swift Package Manager Dependencies
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -resolvePackageDependencies

      - name: Build Xcode Application (Automatic Signing & Apple Development)
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign & Inject Apple Development Certificate & Mock Provisioning (Diawi.com Ready)
        script: |
          APP_PATH="ios/App/build/Build/Products/Release-iphoneos/App.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Error: App.app not found"
            exit 1
          fi

          # จำลองสร้างใบรับรองความปลอดภัยสำหรับกระจายแอปในโหมด Ad-Hoc
          cat << 'EOF' > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>MOCKTEAMID1.com.ncp.snakegame</string>
              <key>get-task-allow</key>
              <true/>
              <key>keychain-access-groups</key>
              <array>
                  <string>MOCKTEAMID1.*</string>
              </array>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > "$APP_PATH/embedded.mobileprovision"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>AppIDName</key>
              <string>SnakeGame3D</string>
              <key>ApplicationIdentifierPrefix</key>
              <array>
                  <string>MOCKTEAMID1</string>
              </array>
              <key>CreationDate</key>
              <date>2026-11-07T00:00:00Z</date>
              <key>Entitlements</key>
              <dict>
                  <key>application-identifier</key>
                  <string>MOCKTEAMID1.com.ncp.snakegame</string>
                  <key>get-task-allow</key>
                  <true/>
              </dict>
              <key>ExpirationDate</key>
              <date>2027-11-07T00:00:00Z</date>
              <key>Name</key>
              <string>iOS Team Provisioning Profile: com.ncp.snakegame</string>
              <key>TeamIdentifier</key>
              <array>
                  <string>MOCKTEAMID1</string>
              </array>
              <key>TimeToLive</key>
              <integer>365</integer>
              <key>Version</key>
              <integer>1</integer>
          </dict>
          </plist>
          EOF

          # ห่อหุ้มโครงสร้างเข้าโฟลเดอร์สำหรับติดตั้งบนมือถือจริง
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ../../SnakeGame3D.ipa Payload/
          echo "✓ Created installable SnakeGame3D.ipa successfully!"

        artifacts:
      - "*.ipa"

