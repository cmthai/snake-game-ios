workflows:
  ios-capacitor:
    name: Build iOS Capacitor App - SnakeGame3D
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Extract iOS project from zip
        script: |
          echo "📦 Extracting iOS project..."
          if [ -f "ios.zip" ]; then
            mkdir -p ios
            python3 - << 'PYEOF'
          import zipfile, os
          with zipfile.ZipFile('ios.zip', 'r') as z:
              for info in z.infolist():
                  clean_name = info.filename.replace('\\', '/').lstrip('/')
                  if not clean_name:
                      continue
                  target_path = os.path.join('ios', clean_name)
                  if clean_name.endswith('/'):
                      os.makedirs(target_path, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target_path), exist_ok=True)
                      with z.open(info) as src, open(target_path, 'wb') as dst:
                          dst.write(src.read())
          print("Extracted and normalized iOS project files successfully.")
          PYEOF
            if [ -d "App" ] && [ ! -d "ios/App" ]; then
              mv App ios/
            fi
            if [ -d "ios/ios/App" ]; then
              mv ios/ios/* ios/
              rm -rf ios/ios
            fi
          fi
          echo "✓ iOS project tree ready at ios/App"

          # Fix permissions on all extracted directories and files
          chmod -R u+rwX,go+rX ios/ 2>/dev/null || true
          find ios -type d -exec chmod 755 {} + 2>/dev/null || true
          find ios -type f -exec chmod 644 {} + 2>/dev/null || true

          # Ensure CapApp-SPM directory and Swift source file exist with 755/644 permissions
          mkdir -p ios/App/CapApp-SPM/Sources/CapApp-SPM
          echo 'import Foundation' > ios/App/CapApp-SPM/Sources/CapApp-SPM/CapApp-SPM.swift
          echo 'public let isCapacitorApp = true' >> ios/App/CapApp-SPM/Sources/CapApp-SPM/CapApp-SPM.swift
          chmod -R 755 ios/App/CapApp-SPM
          chmod 644 ios/App/CapApp-SPM/Sources/CapApp-SPM/CapApp-SPM.swift
          chmod 644 ios/App/CapApp-SPM/Package.swift 2>/dev/null || true

          # Create Xcode workspace data (One-line format to prevent YAML heredoc indentation errors)
          mkdir -p ios/App/App.xcodeproj/project.xcworkspace
          echo '<?xml version="1.0" encoding="UTF-8"?><Workspace version="1.0"><FileRef location="self:"></FileRef></Workspace>' > ios/App/App.xcodeproj/project.xcworkspace/contents.xcworkspacedata

          mkdir -p ios/App/App.xcworkspace
          echo '<?xml version="1.0" encoding="UTF-8"?><Workspace version="1.0"><FileRef location="group:App.xcodeproj"></FileRef></Workspace>' > ios/App/App.xcworkspace/contents.xcworkspacedata

      - name: Create Web Assets Mock Target (Prevent Stale Build Steps)
        script: |
          echo "🛠️ Creating Web Assets Targets (dist, www, public)..."
          mkdir -p www dist ios/App/App/public

          # Priority 1: If root index.html exists, use it
          if [ -f "index.html" ]; then
            echo "✓ Using root index.html"
            cp index.html www/
            cp index.html ios/App/App/public/
          # Priority 2: If ios/App/App/public/index.html was already in ios.zip, keep it
          elif [ -f "ios/App/App/public/index.html" ] && [ $(wc -c < "ios/App/App/public/index.html") -gt 500 ]; then
            echo "✓ Using extracted game assets from ios package"
            cp ios/App/App/public/index.html www/
          else
            # Priority 3: Create elegant loading redirect bridge to live game server
            echo "🌐 Creating live redirect bridge to SnakeGame3D Server..."
            echo '<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover"><title>SnakeGame3D</title><style>*{box-sizing:border-box;margin:0;padding:0;}body,html{width:100vw;height:100vh;background:radial