workflows:
  ios-capacitor-workflow:
    name: Build iOS Capacitor App (No Mac Needed)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Extract iOS project from zip
        script: |
          echo "📦 Checking for ios.zip..."
          if [ -f "ios.zip" ]; then
            echo "📦 Found ios.zip! Extracting to root directory..."
            unzip -o -q ios.zip
            echo "✓ ios.zip extracted successfully"
            ls -la ios
          else
            echo "ℹ️ No ios.zip file found, using existing ios directory"
          fi

      - name: Install Node dependencies
        script: |
          echo "📥 Installing npm packages..."
          npm install

      - name: Prepare web assets
        script: |
          echo "🌐 Syncing web assets to www/ folder..."
          node scripts/sync_www.js

      - name: Capacitor Sync iOS
        script: |
          echo "🔄 Running Capacitor sync for iOS..."
          npx cap sync ios

      - name: Build iOS Application (.ipa / Archive)
        script: |
          echo "🔨 Building iOS project with Xcode..."
          cd ios/App
          
          # Clean and archive project without requiring Mac Code Signing certificates
          xcodebuild clean \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Package into standard .ipa for installation / sideloading
          echo "📦 Packaging App into .ipa format..."
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r -q SnakeGame3D.ipa Payload/
          echo "🎉 SnakeGame3D.ipa created successfully!"

    artifacts:
      - ios/App/build/SnakeGame3D.ipa
      - ios/App/build/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

