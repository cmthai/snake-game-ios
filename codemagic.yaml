workflows:
  ios-capacitor:
    name: Build iOS Capacitor App (No Mac Needed)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      ios_signing:
        distribution_type: development  # ใช้โหมดพัฒนาและทดสอบส่วนบุคคลฟรี
    scripts:
      - name: Extract iOS project from zip
        script: |
          echo "Extracting iOS project..."
          unzip -o ios.zip

      - name: Ensure Package Config (Auto-heal if missing)
        script: |
          if [ ! -f "package.json" ]; then
            echo '{"name":"snakegame3d","version":"1.0.0","dependencies":{"@capacitor/core":"^8.6.0","@capacitor/cli":"^8.6.0","@capacitor/ios":"^8.6.0"}}' > package.json
          fi
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.ncp.snakegame","appName":"เกมเศรษฐี 3D","webDir":"ios/App/App/public"}' > capacitor.config.json
          fi

      - name: Resolve Swift Package Manager Dependencies
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -resolvePackageDependencies

      - name: Initialize Code Signing Settings
        script: |
          # เรียกใช้งานคำสั่งจำลองใบรับรองอัตโนมัติจาก Codemagic เพื่อสวมสิทธิ์ Apple ID ของคุณ
          xcode-project use-profiles

      - name: Build iOS Xcode Application
        script: |
          cd ios/App
          # บิวด์แอปแบบใช้สิทธิ์การเซ็นสัญญาอัตโนมัติ (เปิดระบการเซ็นตาม Apple ID)
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build

      - name: Package .app into Installable .ipa
        script: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r ../../../../SnakeGame3D.ipa Payload
          echo "Created SnakeGame3D.ipa with profile successfully!"

    artifacts:
      - SnakeGame3D.ipa
