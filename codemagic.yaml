workflows:
  ios-capacitor:
    name: Build iOS Capacitor App (No Mac Needed)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Extract iOS project from zip
        script: |
          unzip -o ios.zip
      - name: Create Web Assets Mock Target
        script: |
          mkdir -p dist www
          touch dist/index.html www/index.html
          echo '{"name": "snakegame", "version": "1.0.0", "dependencies": {"@capacitor/core": "^6.0.0", "@capacitor/ios": "^6.0.0"}, "devDependencies": {"@capacitor/cli": "^6.0.0"}}' > package.json
      - name: Install Node dependencies
        script: |
          npm install
      - name: Repair and Force Sync Capacitor
        script: |
          npx cap sync ios
      - name: Build iOS Xcode Application
        script: |
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
    artifacts:
      - ios/App/build/Release-iphoneos/*.app
