workflows:
  ios-capacitor:
    name: Build iOS Capacitor App (No Mac Needed)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Extract iOS project from zip
        script: |
          unzip -o ios.zip
      - name: Install Node dependencies
        script: |
          npm install --include=dev
          npm install @capacitor/cli @capacitor/core @capacitor/ios
      - name: Repair and Force Sync Capacitor
        script: |
          npx cap sync ios --inline
      - name: Build iOS Xcode Application
        script: |
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
    artifacts:
      - ios/App/build/Release-iphoneos/*.app
      - build/Release-iphoneos/*.app
      - ios/App/build/**/*.app
